name: VULN-187171 local version proof

on:
  workflow_dispatch:
  push:
    branches:
      - security/vuln-187171-outputcache-followup
    paths:
      - 'eng/security-research/VULN-187171/**'
      - 'src/Middleware/OutputCaching/src/Policies/DefaultPolicy.cs'
      - 'src/Middleware/OutputCaching/test/OutputCacheMultiIdentityTests.cs'
      - '.github/workflows/vuln-187171-local-version-proof.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'eng/security-research/VULN-187171/**'
      - 'src/Middleware/OutputCaching/src/Policies/DefaultPolicy.cs'
      - 'src/Middleware/OutputCaching/test/OutputCacheMultiIdentityTests.cs'
      - '.github/workflows/vuln-187171-local-version-proof.yml'

permissions:
  contents: read

jobs:
  compare-runtime-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Run 9.0.16 versus 9.0.17 proof
        working-directory: eng/security-research/VULN-187171/LocalVersionProof
        run: |
          chmod +x run-version-comparison.sh
          ./run-version-comparison.sh

      - name: Run 9.0.17 incomplete-fix proof with recommended ordering
        working-directory: eng/security-research/VULN-187171/IncompleteFixProof
        run: |
          chmod +x run-incomplete-fix-proof.sh
          ./run-incomplete-fix-proof.sh

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-187171-complete-local-evidence
          path: |
            eng/security-research/VULN-187171/LocalVersionProof/evidence-*.tar.gz
            eng/security-research/VULN-187171/LocalVersionProof/evidence-*.tar.gz.sha256
            eng/security-research/VULN-187171/LocalVersionProof/evidence-*/SUMMARY.txt
            eng/security-research/VULN-187171/IncompleteFixProof/evidence-*.tar.gz
            eng/security-research/VULN-187171/IncompleteFixProof/evidence-*.tar.gz.sha256
            eng/security-research/VULN-187171/IncompleteFixProof/evidence-*/SUMMARY.txt
          if-no-files-found: warn
          retention-days: 14

  source-regression-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and run focused OutputCache test project
        run: |
          chmod +x eng/build.sh
          ./eng/build.sh \
            --ci \
            --projects src/Middleware/OutputCaching/test/Microsoft.AspNetCore.OutputCaching.Tests.csproj \
            -test \
            /p:TestFilter=FullyQualifiedName~OutputCacheMultiIdentityTests
